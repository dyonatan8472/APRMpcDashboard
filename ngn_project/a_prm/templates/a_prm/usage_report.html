{% extends "base.html" %}
{% block title %}Usage Report{% endblock title %}

{% block body_block %}
<div class="container">
    <div class="jumbotron text-center">
        <h1>Usage Report</h1>
        <hr>
        <h2>Please enter the MSISDN number(s).</h2>
        </br>

        <form action="{% url "a_prm:usage_report" %}" method="POST">
            {% csrf_token %}
            <textarea class="form-control input-sm" rows="2" id="id_number" name="id_number" required="required" autofocus></textarea>

            <hr>
            <input type="submit" value="GO!">
        </form>
    </div>
</div>
    
{% endblock %}
