{% extends "base.html" %}
{% block title %}DM40 Update{% endblock title %}

{% block body_block %}
<div class="container">
        <div class="jumbotron text-center">

    <h1 class="display-4">DM40 Update</h1>
    <form action="{% url "a_prm:dm40_update" %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <div class="col-9">
                <label for="file">Upload the dm40 update file</label>
                <input type="file" class="form-control-file" name="dm40_file"
                    style="border: 1px solid black; padding: 5px;" required="required">
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary mt-3">Submit</button>
            </div>
        </div>
        </div>
    </form>
    {% if upload_errors %}
    <p>{{ upload_errors}}</p>
    {% endif %}
    {% if message %}
    <p>{{ message}}</p>
    {% endif %}
    <hr>
</div>
{% endblock %}
