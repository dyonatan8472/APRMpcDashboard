{% extends "base.html" %}
{% block title %}Dealer Map Upload{% endblock title %}

{% block body_block %}
<div class="container">
        <div class="jumbotron text-center">
            <h2>Please load the dealer csv file.</h2>
            <form action="{% url "a_prm:load_dealers" %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <div class="col-9">
                        <label for="file">Upload dealer file</label>
                        <input type="file" class="form-control-file" name="dealers_file"
                            style="border: 1px solid black; padding: 5px;" required="required">
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </div>
            </form>
        </div>

    {% if upload_errors %}
    <p>{{ upload_errors}}</p>
    {% endif %}
    <hr>
</div>
{% endblock %}
