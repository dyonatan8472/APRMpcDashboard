{% load static %}
<!doctype html>
<style>
  .custom-table {
    font-size: 16px; /* Your custom font size here */
  }
  .custom-header {
    font-size: 18px; /* Your custom font size for headers here */
  }
  .custom-cell {
    font-size: 14px; /* Your custom font size for cells here */
  }
</style>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'ngn_project/css/master.css' %}">
    <title>APRM Dashboard - {% block title %}{% endblock title %}</title>
</head>
<body>
    {% include 'navbar.html' %}
    <br/>
    <div class="container">
        {% if messages %}
            {% for message in messages %}

                {% if message.tags == 'error' %}
                    <div class="alert alert-danger alert-dissmissabe" role="alert">
                {% else %}
                    <div class="alert alert-{{ message.tags }} alert-dissmissabe" role="alert">
                {% endif %}
                    <button class="close" data-dismiss="alert">
                        <small><sup>x</sup></small>
                    </button>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>
    {% block body_block %}
    {% endblock %}
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
        crossorigin="anonymous"></script>
</body>

</html>
